<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Analyzer</title>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <style>
        :root {
            /* Categorical palette, validated against this page's card
               surface (#1e293b) via the dataviz skill's validator - fixed
               hue order, never reassigned per-category. */
            --series-1: #3987e5;
            --series-2: #008300;
            --series-3: #d55181;
            --series-4: #c98500;
            --series-5: #199e70;
            --series-6: #d95926;
            --series-7: #9085e9;
            --series-8: #e66767;
        }
        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }
        button {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #0ea5e9;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        #status.error {
            color: #f87171;
        }
        .bank {
            margin-bottom: 1rem;
        }
        .bank-name {
            font-weight: 600;
            margin-bottom: 0.4rem;
        }
        .account {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.9rem;
        }
        .account-type {
            color: #94a3b8;
            text-transform: capitalize;
        }
        .hidden {
            display: none;
        }
        #welcome {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
            margin-bottom: 0.75rem;
        }
        .date-row {
            display: flex;
            gap: 0.75rem;
        }
        .date-row input {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            text-align: left;
            padding: 0.5rem 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }
        th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        td.amount {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .table-wrap {
            overflow-x: auto;
        }
        .pending-tag {
            font-size: 0.7rem;
            color: #fbbf24;
        }
        .category-viz {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .pie-chart {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .category-legend {
            flex: 1;
            min-width: 220px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0;
            font-size: 0.85rem;
        }
        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .legend-label {
            flex: 1;
        }
        .legend-amount {
            font-variant-numeric: tabular-nums;
            color: #94a3b8;
        }
        .category-bars {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }
        .bar-row-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }
        .bar-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Transaction Analyzer</h1>
        <p class="subtitle">Link your bank accounts to start tracking spend.</p>

        <div id="identity-card" class="card">
            <div id="welcome" class="hidden"></div>
            <div id="identity-form">
                <input id="username-input" type="text" placeholder="Enter your name" />
                <button id="create-user-btn">Continue</button>
            </div>
        </div>

        <div id="link-card" class="card hidden">
            <button id="link-bank-btn">Link a bank account</button>
            <div id="status"></div>
        </div>

        <div id="accounts-card" class="card hidden">
            <h2 style="margin-top:0; font-size:1.1rem;">Linked accounts</h2>
            <div id="accounts-list"></div>
        </div>

        <div id="pull-card" class="card hidden">
            <h2 style="margin-top:0; font-size:1.1rem;">Pull transactions</h2>
            <select id="account-select"></select>
            <div class="date-row">
                <input id="date-from-input" type="date" />
                <input id="date-to-input" type="date" />
            </div>
            <button id="pull-btn">Pull transactions</button>
            <div id="pull-status"></div>
        </div>

        <div id="transactions-card" class="card hidden">
            <h2 style="margin-top:0; font-size:1.1rem;">All transactions</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Bank</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body"></tbody>
                </table>
            </div>
        </div>

        <div id="categorize-card" class="card hidden">
            <h2 style="margin-top:0; font-size:1.1rem;">Categorize Spend</h2>
            <button id="categorize-btn">Categorize Spend</button>
            <div id="categorize-status"></div>
            <div id="categorize-results" class="hidden">
                <div class="category-viz">
                    <div id="pie-chart" class="pie-chart"></div>
                    <div id="category-legend" class="category-legend"></div>
                </div>
                <div id="category-bars" class="category-bars"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
